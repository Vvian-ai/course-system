<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生选课详情</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .info { text-align: center; font-size: 18px; color: #555; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2196F3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .empty { text-align: center; color: #888; font-size: 16px; padding: 20px; }
        .back-link { display: block; text-align: center; margin-top: 20px; }
        .back-link a { color: #2196F3; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
        .grade-ok { color: #4CAF50; font-weight: bold; }
        .grade-pending { color: #FF9800; }
        .btn { display: inline-block; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-success:hover { background: #388E3C; }
        .grade-input { width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .flex-form { display: flex; gap: 10px; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="'👤 学生：' + ${student.name} + ' (' + ${student.studentId} + ')'">学生信息</h2>
    <p class="info" th:text="'专业：' + ${student.major}">专业</p>

    <div th:if="${enrollments == null or enrollments.isEmpty()}">
        <p class="empty">📭 该学生暂无选课记录</p>
    </div>

    <div th:unless="${enrollments == null or enrollments.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>课程编号</th>
                <th>当前成绩</th>
                <th>录入成绩</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="enroll : ${enrollments}">
                <td th:text="${enroll.courseId}">001</td>
                <td>
                    <span th:if="${enroll.grade == null}" class="grade-pending">未录入</span>
                    <span th:unless="${enroll.grade == null}" class="grade-ok" th:text="${enroll.grade}">90</span>
                </td>
                <td>
                    <div class="flex-form">
                        <input type="number" class="grade-input"
                               th:id="'grade_' + ${enroll.courseId}"
                               min="0" max="100" placeholder="分数">
                        <button class="btn btn-success"
                                th:data-student-id="${student.studentId}"
                                th:data-course-id="${enroll.courseId}"
                                onclick="saveGrade(this)">
                            💾 保存
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="back-link">
        <a href="/view/courses">← 返回课程列表</a> |
        <a href="/admin">📊 管理中心</a>
    </div>
</div>

<script>
    function saveGrade(btn) {
        var studentId = btn.getAttribute('data-student-id');
        var courseId = btn.getAttribute('data-course-id');
        var input = document.getElementById('grade_' + courseId);

        if (!input) {
            alert('找不到输入框');
            return;
        }

        var grade = input.value.trim();
        if (grade === '') {
            alert('请输入成绩');
            return;
        }

        var numGrade = parseInt(grade);
        if (isNaN(numGrade) || numGrade < 0 || numGrade > 100) {
            alert('成绩必须在 0 到 100 之间');
            return;
        }

        fetch('/api/enrollments/grade?studentId=' + studentId + '&courseId=' + courseId + '&grade=' + numGrade, {
            method: 'PUT'
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                alert('成绩录入成功！');
                location.reload();
            } else {
                alert('录入失败：' + data.message);
            }
        })
        .catch(err => alert('请求失败：' + err));
    }
</script>
</body>
</html>
