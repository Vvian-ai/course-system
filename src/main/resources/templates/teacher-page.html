<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教师端 - 课程系统</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: white; padding: 20px 30px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; color: #333; }
        .header .back { color: #2196F3; text-decoration: none; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #FF9800; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #FF9800; color: white; }
        .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-primary:hover { background: #1976D2; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-success:hover { background: #388E3C; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .badge-success { background: #4CAF50; color: white; }
        .badge-warning { background: #FF9800; color: white; }
        .grade-input { width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .flex { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .teacher-info { font-weight: bold; color: #333; }
        .empty { color: #888; padding: 10px; }
        .flex-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .logout-btn { background: #f44336; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { background: #d32f2f; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>👨‍🏫 教师端</h2>
        <div class="flex-row">
            <span class="teacher-info" id="userInfo">加载中...</span>
            <button class="logout-btn" onclick="logout()">退出</button>
            <a href="/" class="back">🏠 返回首页</a>
        </div>
    </div>

    <div class="card">
        <h3>📖 我的授课课程</h3>
        <div id="teachingCoursesContainer">
            <p class="empty">加载中...</p>
        </div>
    </div>

    <div class="card" id="studentListCard" style="display:none;">
        <h3>👨‍🎓 学生名单</h3>
        <div id="studentListContent"></div>
    </div>
</div>

<script>
    const username = localStorage.getItem('username');
    const role = localStorage.getItem('role');

    if (!username) {
        window.location.href = '/login';
    }

    const roleMap = { 'student': '学生', 'teacher': '教师', 'admin': '管理员' };
    document.getElementById('userInfo').textContent = '👤 ' + username + '（' + (roleMap[role] || role) + '）';

    let allCourses = [];
    let currentCourseId = null;

    function loadTeachingCourses() {
        const container = document.getElementById('teachingCoursesContainer');
        fetch('/api/courses')
        .then(res => {
            if (res.status === 401) {
                window.location.href = '/login';
                throw new Error('未登录');
            }
            return res.json();
        })
        .then(data => {
            if (data.code === 200) {
                allCourses = data.data || [];
                const myCourses = allCourses.filter(c => c.teacherId === username);
                if (myCourses.length === 0) {
                    container.innerHTML = '<p class="empty">暂未分配授课课程</p>';
                    return;
                }
                let html = `<table>
                    <thead><tr><th>编号</th><th>名称</th><th>学分</th><th>操作</th></tr></thead>
                    <tbody>`;
                myCourses.forEach(c => {
                    html += `<tr>
                        <td>${c.courseId}</td>
                        <td>${c.courseName}</td>
                        <td>${c.credit}</td>
                        <td><button class="btn btn-primary btn-sm" data-id="${c.courseId}" onclick="viewStudents(this.getAttribute('data-id'))">查看学生名单</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p class="empty" style="color:red;">加载失败：' + data.message + '</p>';
            }
        })
        .catch(err => {
            if (err.message !== '未登录') {
                container.innerHTML = '<p class="empty" style="color:red;">加载失败：' + err + '</p>';
            }
        });
    }

    function viewStudents(courseId) {
        currentCourseId = courseId;
        const card = document.getElementById('studentListCard');
        const content = document.getElementById('studentListContent');
        card.style.display = 'block';
        content.innerHTML = '<p class="empty">加载中...</p>';

        fetch('/api/enrollments/byCourse?courseId=' + courseId)
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                const list = data.data || [];
                if (list.length === 0) {
                    content.innerHTML = '<p class="empty">该课程暂无学生选课</p>';
                    return;
                }
                let html = `<table>
                    <thead><tr><th>学号</th><th>成绩</th><th>录入成绩</th></tr></thead>
                    <tbody>`;
                list.forEach(e => {
                    const gradeDisplay = (e.grade === null || e.grade === undefined)
                        ? '<span class="badge badge-warning">未录入</span>'
                        : '<span class="badge badge-success">' + e.grade + '</span>';
                    html += `<tr>
                        <td>${e.studentId}</td>
                        <td>${gradeDisplay}</td>
                        <td>
                            <div class="flex">
                                <input type="number" class="grade-input" id="grade_${e.studentId}" min="0" max="100" placeholder="分数">
                                <button class="btn btn-success btn-sm" onclick="enterGrade('${e.studentId}', '${courseId}')">💾 保存</button>
                            </div>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                content.innerHTML = html;
            } else {
                content.innerHTML = '<p class="empty" style="color:red;">加载失败：' + data.message + '</p>';
            }
        })
        .catch(err => {
            content.innerHTML = '<p class="empty" style="color:red;">加载失败：' + err + '</p>';
        });
    }

    function enterGrade(studentId, courseId) {
        const input = document.getElementById('grade_' + studentId);
        if (!input) return;
        const grade = input.value.trim();
        if (grade === '') { alert('请输入成绩'); return; }
        const num = parseInt(grade);
        if (isNaN(num) || num < 0 || num > 100) { alert('成绩必须在 0-100 之间'); return; }

        fetch('/api/enrollments/grade?studentId=' + studentId + '&courseId=' + courseId + '&grade=' + num, {
            method: 'PUT'
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                alert('成绩录入成功！');
                viewStudents(courseId);
            } else {
                alert('录入失败：' + data.message);
            }
        })
        .catch(err => alert('请求失败：' + err));
    }

    function logout() {
        fetch('/api/logout', { method: 'POST' })
            .finally(() => {
                localStorage.clear();
                window.location.href = '/login';
            });
    }

    window.onload = function() {
        loadTeachingCourses();
    };
</script>
</body>
</html>
