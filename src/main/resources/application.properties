# Activate local dev profile
spring.profiles.active=dev

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/course_system?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000

# JPA: validate schema against schema.sql instead of auto-modifying
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL init: always run schema.sql to create tables if missing
# 注意：不要开启 spring.jpa.defer-datasource-initialization，
# 否则 schema.sql 会在 Hibernate 之后执行，全新数据库上 validate 会因缺表而失败
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Timezone
spring.jackson.time-zone=Asia/Shanghai

# Redis config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Spring Cache
spring.cache.type=redis

# Logging
logging.level.com.example.course_system=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Knife4j API docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
knife4j.enable=true

# Admin account (BCrypt hash, plaintext is "admin123")
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# JWT secret (at least 32 chars, override with env var in production)
app.jwt.secret=${JWT_SECRET}
