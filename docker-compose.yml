services:
  mysql:
    image: mysql:8.0
    container_name: course-system-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: course_system
    # 只在 Docker 内部网络暴露，不占用宿主机的 3306，
    # 避免与本地已安装的 MySQL 冲突。
    # 如果需要用客户端从本机连接容器里的数据库，取消下面两行注释。
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: course-system-redis
    # 同上：不占用宿主机的 6379，避免与本地 Redis 冲突
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: course-system-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内通过服务名访问，覆盖 application.properties 里的 localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course_system?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
      # 以下对应 application.properties 中的 ${...} 占位符
      # 本地开发时这些值由 application-dev.properties 提供（该文件不入库）
      DB_USERNAME: root
      DB_PASSWORD: root1234
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: $2a$10$PhpgKD/UkicLauJpSEEIQea9dLB.ps4a5g6SpoRLtQIxGeK0ncuea
      JWT_SECRET: local-docker-only-secret-key-at-least-32-characters
    ports:
      - "8080:8080"

volumes:
  mysql-data:
